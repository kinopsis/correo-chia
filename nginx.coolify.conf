# ============================================================
# Nginx Config — Coolify (Proxy Unificado)
# Sistema de Atencion Ciudadana — Alcaldia de Chia
# ============================================================
# Sirve el frontend estatico (SPA) y proxyfica todas las APIs
# de Supabase local y MinIO a traves de un unico puerto (80).
#
# Rutas:
#   /                  → Frontend SPA (index.html)
#   /auth/v1/*         → Supabase Auth (GoTrue)
#   /rest/v1/*         → Supabase REST API (PostgREST)
#   /realtime/v1/*     → Supabase Realtime (WebSocket)
#   /studio/*          → Supabase Studio (Dashboard)
#   /storage/*         → MinIO S3 API (adjuntos)
#   /minio-console/*   → MinIO Web Console
#   /health            → Health check endpoint
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1000;
    gzip_vary on;

    upstream supabase_auth { server auth:9999; }
    upstream supabase_rest { server rest:3000; }
    upstream supabase_realtime { server realtime:4000; }
    upstream supabase_studio { server studio:3000; }
    upstream minio_api { server minio:9000; }
    upstream minio_console { server minio:9001; }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /health {
            return 200 '{"status":"ok","service":"chia"}';
            add_header Content-Type application/json;
        }

        location /auth/v1/ {
            proxy_pass http://supabase_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rest/v1/ {
            proxy_pass http://supabase_rest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /realtime/v1/ {
            proxy_pass http://supabase_realtime/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /studio/ {
            proxy_pass http://supabase_studio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /storage/ {
            proxy_pass http://minio_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 50M;
        }

        location /minio-console/ {
            proxy_pass http://minio_console/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /manifest.json {
            expires 7d;
            add_header Cache-Control "public";
        }

        location = /sw.js {
            expires 0;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
