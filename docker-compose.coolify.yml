version: '3.8'

# ============================================================
# Docker Compose — Coolify (MinIO Local + Supabase Cloud)
# ============================================================
# Servicios locales:
#   - MinIO: Almacenamiento S3 para adjuntos
#   - Nginx: Sirve el frontend estatico
#
# Supabase (DB, Auth, REST, Realtime, Edge Functions)
# se usa como servicio Cloud en batppagyceeazffjduxk.supabase.co
#
# Para iniciar:
#   1. Construir el frontend:  cd frontend && npm ci && npm run build
#   2. cp .env.coolify .env
#   3. docker compose -f docker-compose.coolify.yml up -d
# ============================================================

services:
  minio:
    image: minio/minio:latest
    container_name: chia-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chia-net

  minio-init:
    image: minio/mc:latest
    container_name: chia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/attachments;
      mc mb --ignore-existing local/reportes;
      mc version enable local/attachments;
      mc ilm rule add local/attachments --expire-days 180;
      mc anonymous set download local/reportes;
      echo 'MinIO buckets configured';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - chia-net

  nginx:
    image: nginx:alpine
    container_name: chia-nginx
    restart: always
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.coolify.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - chia-net

volumes:
  minio_data:

networks:
  chia-net:
    driver: bridge
